services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Od PostgreSQL 18 wolumen montuje się katalog wyżej, dane trafiają do podkatalogu z numerem wersji
      - db_data:/var/lib/postgresql
      # Skrypty SQL dostępne w kontenerze jako /db (psql -f /db/01_schema.sql)
      - ./db:/db:ro

volumes:
  db_data:
