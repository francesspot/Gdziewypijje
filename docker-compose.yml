services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Od PostgreSQL 18 wolumen montuje się katalog wyżej, dane trafiają do podkatalogu z numerem wersji
      - db_data:/var/lib/postgresql

volumes:
  db_data:
